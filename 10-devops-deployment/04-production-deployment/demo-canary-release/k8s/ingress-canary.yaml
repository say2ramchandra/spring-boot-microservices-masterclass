apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-app-canary
  namespace: canary-demo
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20" # Traffic percentage for canary
spec:
  ingressClassName: nginx
  rules:
    - host: canary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: canary-app
                port:
                  number: 80
