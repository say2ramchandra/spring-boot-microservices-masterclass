apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-app
  namespace: canary-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: canary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: canary-app
                port:
                  number: 80
