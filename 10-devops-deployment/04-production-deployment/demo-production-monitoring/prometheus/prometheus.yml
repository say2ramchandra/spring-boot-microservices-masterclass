global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Theory: add application endpoints here (for example Spring Boot actuator /actuator/prometheus).
  - job_name: 'application-metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
