apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-sample-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: main
    path: 10-devops-deployment/03-ci-cd/demo-gitops-argocd/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
