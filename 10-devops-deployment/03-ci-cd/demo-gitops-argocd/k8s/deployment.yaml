apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-sample-app
  namespace: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-sample-app
  template:
    metadata:
      labels:
        app: gitops-sample-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine # Change this in Git to trigger GitOps sync
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
