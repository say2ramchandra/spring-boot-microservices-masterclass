server:
  port: 8201

spring:
  application:
    name: cqrs-pattern-demo
  
  # Separate datasources for write and read models
  # In production, these would be different databases
  datasource:
    url: jdbc:h2:mem:cqrsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.masterclass.patterns.cqrs: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
