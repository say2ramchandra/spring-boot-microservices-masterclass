server:
  port: 8087

spring:
  application:
    name: circuit-breaker-demo

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Register health indicator
        registerHealthIndicator: true
        # Sliding window type: COUNT_BASED or TIME_BASED
        slidingWindowType: COUNT_BASED
        # Size of the sliding window
        slidingWindowSize: 10
        # Minimum calls before circuit breaker can calculate failure rate
        minimumNumberOfCalls: 5
        # Failure rate threshold (percentage)
        failureRateThreshold: 50
        # Wait duration before transitioning from OPEN to HALF_OPEN
        waitDurationInOpenState: 10s
        # Number of permitted calls in HALF_OPEN state
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatic transition from OPEN to HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Slow call duration threshold
        slowCallDurationThreshold: 2s
        # Slow call rate threshold
        slowCallRateThreshold: 100
        # Record exceptions as failures
        recordExceptions:
          - java.lang.Exception
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        # Ignore these exceptions
        ignoreExceptions:
          - com.masterclass.cloud.circuitbreaker.exception.BusinessException
    
    instances:
      # Circuit breaker for Product Service
      productService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      
      # Circuit breaker for Payment Service (more strict)
      paymentService:
        baseConfig: default
        failureRateThreshold: 30
        waitDurationInOpenState: 15s
        slidingWindowSize: 5
      
      # Circuit breaker for Inventory Service
      inventoryService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 8s

  # Retry configuration
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      productService:
        baseConfig: default

  # Rate Limiter configuration
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
    instances:
      productService:
        limitForPeriod: 5
        limitRefreshPeriod: 1s

  # Bulkhead configuration (thread pool isolation)
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 10ms
    instances:
      productService:
        maxConcurrentCalls: 5

  # Time Limiter configuration
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      productService:
        timeoutDuration: 2s

logging:
  level:
    io.github.resilience4j: DEBUG
    com.masterclass.cloud.circuitbreaker: DEBUG
